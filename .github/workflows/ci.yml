name: CI

on:
  push:
    branches:
      - main
      - feat/reranker
      # Added so this branch's CI actually runs. A branch that pushes nothing
      # and gates nothing is a branch whose green is a local memory: the whole
      # point of a runner is that it is not this machine. Removed when the
      # branch merges.
      - wip/platform-readiness
      # Same reason as the line above: this branch's green must be a runner's
      # green, not a laptop's. Removed when the branch merges.
      - wip/claims-and-lab
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # The CPU index, because the runner has no GPU and the default PyPI torch
      # wheel is the CUDA build.
      #
      # Measured this session, torch 2.9.1 cp311 linux x86_64:
      #   default PyPI wheel   900 MB, and it depends on the nvidia-* tree
      #   CPU index wheel      184 MB
      # The 716 MB is the wheel alone; the nvidia wheels it drags in are larger
      # again. Nothing in this suite uses CUDA, so the runner was downloading a
      # GPU stack it could never execute -- which is also why `cache: pip` had
      # little to save on a cold key and why a dependency bump re-downloaded
      # gigabytes for no behavioural change.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
          python -m pip install --no-deps -e .
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Verify package imports
        run: |
          python -c "import api, cli; print('imports ok')"

      - name: Verify milestone and release metadata
        run: |
          python scripts/release/check_versioning.py

      - name: Verify documented claims point at real evidence
        run: |
          python scripts/check_evidence.py --strict

      - name: Apply database migrations
        run: |
          python -m pip install pgvector
          python -m alembic -c migrations/alembic.ini -x script_location=migrations upgrade head

      # The tenant-isolation suite is only meaningful against a role that cannot
      # bypass row-level security, and the `postgres` service creates `mpadmin` as
      # a superuser. `scripts/db/runtime_roles.sql` adds the least-privileged role
      # the application would actually use; the suite creates it itself so a
      # missing role fails loudly instead of skipping.
      #
      # The password is supplied here because the script refuses to provision a
      # role that cannot log in -- which reads as an RLS problem and is not one.
      - name: Provision the least-privileged runtime role
        run: |
          psql postgresql://mpadmin:secret@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -v runtime_password=ci-runtime-role-password \
            -f scripts/db/runtime_roles.sql

      # The script must work on a database that has never had it applied. Running
      # it twice proves both that the grants are idempotent and that a rotation
      # (running it again with a new password) is what the documentation claims.
      - name: The role script is safe to re-run
        run: |
          psql postgresql://mpadmin:secret@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -v runtime_password=ci-runtime-role-password \
            -f scripts/db/runtime_roles.sql
          PGPASSWORD=ci-runtime-role-password psql \
            postgresql://mindpalace_runtime@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -tAc "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user"

      # These two run IMMEDIATELY after provisioning, not at the end of the job.
      #
      # They used to run last, after `Run tests` and `Tenant isolation`. That
      # ordering was wrong and it failed on every runner:
      #
      #   tests/tenant_harness.py:66  RUNTIME_PASSWORD = "tenant-isolation-test-password"
      #
      # and the harness runs a modified copy of scripts/db/runtime_roles.sql
      # against $DATABASE_URL. On CI that is the SHARED mindpalace database, so
      # the tenant-isolation step rotates the runtime role's password. Every
      # later step that authenticates as mindpalace_runtime with
      # ci-runtime-role-password then fails to connect, and `posture` degrades
      # to "unknown means not proven" -- reporting all 13 protected tables as
      # unprotected. The database was fine. The check was pointed at a
      # database whose role had been rotated underneath it.
      #
      # Measured, after reproducing the exact sequence on a disposable database:
      #   before the tenant-isolation subset : posture PASS, all 13 tables rls+force
      #   after  the tenant-isolation subset : role 'unknown', password auth failed
      #
      # Posture is a property of the DEPLOYMENT, so it belongs where the
      # deployment is built, not where the tests have finished trampling it.
      # The identity check has to run as the maintenance role or it is vacuous:
      # `mindpalace_resolve_credential` is SECURITY DEFINER, so the least-
      # privileged role authenticates through it exactly as production does.
      # This is a NEGATIVE test: starting as a role that bypasses row-level
      # security must fail, and must say why.
      #
      # It used to assert that `import api.main` fails. That is the wrong entry
      # point, and api/main.py says so in its own docstring: importing the module
      # must not require a connection, so the database posture is checked in the
      # lifespan, before the server accepts a request. Asserting the import
      # refused tested a behaviour the product deliberately does not have, and it
      # failed on the first real runner for exactly that reason.
      #
      # It is strengthened, not relaxed: it now asserts BOTH a nonzero exit AND
      # the refusal reason, so a crash for any other reason -- a typo in a URL, a
      # missing driver -- cannot be mistaken for a posture refusal.
      - name: A server deployment refuses an unsafe database role
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          MIND_PALACE_DEPLOYMENT: server
          MIND_PALACE_AUTH_MODE: required
          MIND_PALACE_INGEST_ROOTS: /content
        run: |
          set +e
          python - <<'PYEOF' > /tmp/posture.out 2>&1
          import asyncio
          from api.main import enforce_startup_posture
          asyncio.run(enforce_startup_posture())
          PYEOF
          code=$?
          set -e
          cat /tmp/posture.out
          if [ "$code" -eq 0 ]; then
            echo "::error::started as the cluster superuser, which bypasses every"
            echo "::error::row-level policy. A server deployment must refuse."
            exit 1
          fi
          if ! grep -q "refusing to start" /tmp/posture.out; then
            echo "::error::startup exited nonzero but did not say it refused to start."
            echo "::error::A crash is not a posture refusal; the step must prove the reason."
            exit 1
          fi
          echo "refused as expected, with a reason"

      # And the positive half: the SAME check, on the least-privileged role, must
      # pass. Run through the lifespan too, so this proves startup rather than
      # import -- which is the thing the negative step above actually tests.
      - name: A server deployment starts on the least-privileged role
        env:
          DATABASE_URL: postgresql://mindpalace_runtime:ci-runtime-role-password@localhost:5432/mindpalace
          MIND_PALACE_DEPLOYMENT: server
          MIND_PALACE_AUTH_MODE: required
          MIND_PALACE_INGEST_ROOTS: /content
        run: |
          python -c "from api.main import app; print('server profile accepted the runtime role')"
          python - <<'PYEOF'
          import asyncio
          from api.main import enforce_startup_posture
          asyncio.run(enforce_startup_posture())
          print('lifespan posture check passed on the least-privileged role')
          PYEOF


      # A deployment must not be tenant-safe by accident. `mindpalace posture`
      # exits non-zero when the role would bypass the policies, so this fails the
      # build rather than leaving it to an operator to notice in production.
      - name: The runtime role cannot bypass row-level security
        env:
          DATABASE_URL: postgresql://mindpalace_runtime:ci-runtime-role-password@localhost:5432/mindpalace
        run: python -m cli.main posture

      - name: Run linting
        run: |
          flake8 api cli tests scripts --max-line-length=100
          black --check api cli tests scripts --line-length 100

      - name: Evaluate deterministic memory lifecycle (offline)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m cli.main eval memory --embeddings fixture --repetitions 1

      # The model weights are declared dependencies, so the runner has to have them
      # before it can test the *default* read path. Without this, the runner has the
      # package but not the model, and 41 tests fail on `OSError: We couldn't connect
      # to ...` -- every test that indexes or ranks anything. `--maxfail=1` reported
      # only the first, so a green local run and a red CI run coexisted through a
      # release. A developer machine already had the cache, which is what hid it.
      #
      # Both models, because both are exercised: the embedder is the default read
      # path, and `test_search_semantics.py` covers `rerank=true` with no guard. The
      # cross-encoder is documented as optional for a deployment, which is true, and
      # irrelevant for a suite that claims to cover the feature.
      #
      # Revisions are pinned, not branches: `snapshot_download(repo)` resolves
      # whatever `main` is today, so a green run says nothing about next week. The
      # embedder's pin is the revision recorded in the frozen M006.75 artifact.
      #
      # Cache first, then download: a hit takes ~1s, a miss ~60s, because the
      # snapshots are ~1.7 GB (they include every format variant, not just the
      # safetensors). Both jobs share one key, so it is stored once. Correctness
      # never depends on the cache, because `--verify` below refuses to proceed
      # unless the pinned revisions are present and loadable. Cached under the
      # default HF cache path only -- no secrets, both models are public.
      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-1110a243fdf4706b3f48f1d95db1a4f5529b4d41-233902d25c440f23af6f7d6e94d2946bac0bee0a

      - name: Provision the pinned model weights
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python scripts/ci/provision_models.py

      # Load each model through the application's own classes, offline, BEFORE any
      # test runs. A missing model should cost one clear line here rather than 41
      # failures forty minutes later. Checking that a directory exists would prove
      # nothing; this loads the model the way the routers do.
      - name: Verify the pinned models load offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python scripts/ci/provision_models.py --verify

      # Everything from here needs no network. Two different requirements -- "the
      # model must exist" and "the tests must not need the network" -- and conflating
      # them is what made the original gap invisible.
      # `-rs` prints the reason for every skip. Without it the run reports
      # "8 skipped" and nothing else, which is how six of them stayed
      # unexplained: a skip count is a number nobody can act on, and a silent
      # skip looks exactly like a passing test in the summary line.
      - name: Run tests
        env:
          MEMORY_TEST_DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q -rs

      # Tenant isolation, as a separate step so a leak cannot hide inside a green
      # run: it needs the pinned models off, the runtime role present, and a
      # visible place for a failure to land. Same command the rest of the suite
      # uses, not a parallel runner, so there is one way to run the tests.
      #
      # `test_credential_management.py` is in this list, not the general one:
      # it covers the surfaces that are not HTTP -- the runtime socket, the
      # unnamed SDK client, MCP -- and a bypass there is as real as one on a route.
      #
      # `test_scope_forgery.py` and `test_error_and_log_hygiene.py` are here for
      # the same reason. The first asserts against the real runtime role that the
      # `{*}` sentinel cannot be self-asserted, and fails on `009`; the second
      # asserts that an unhandled error neither returns nor logs the row that
      # PostgreSQL puts in its constraint detail. Both are fast, and neither
      # belongs in a run that only passes if the whole suite is green.
      - name: Tenant isolation, against the least-privileged role
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          MIND_PALACE_AUTH_MODE: required
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q tests/test_tenant_isolation.py \
                     tests/test_tenant_connection_isolation.py \
                     tests/test_tenant_control_effectiveness.py \
                     tests/test_credential_management.py \
                     tests/test_deployment_profiles_and_lifecycle.py \
                     tests/test_operator_cli.py \
                     tests/test_marketing_reference_integration.py \
                     tests/test_scope_forgery.py \
                     tests/test_error_and_log_hygiene.py

      # Opt-in inside the test, because it creates and drops a database. It is the
      # only place the migration chain is driven `up -> down -> up`, and a
      # downgrade that throws leaves an operator with no way back.
      - name: The migration chain survives a downgrade and a re-apply
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          MIND_PALACE_MIGRATION_ROUNDTRIP: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q tests/test_deployment_profiles_and_lifecycle.py \
                     -k migrations_apply_downgrade_and_reapply

      # The reference integration has to be runnable on its own, from a clean
      # checkout, exactly as its README says -- an example that only works when
      # another test has already seeded the database is not evidence of anything.
      # This is a CLIENT example. examples/marketing-campaign-memory/README.md
      # says so in its own "Run it" section, in two shells:
      #
      #   1. MIND_PALACE_AUTH_MODE=required uvicorn api.main:app --port 8000
      #   2. python examples/marketing-campaign-memory/demo.py
      #
      # The step ran only the second one, so the demo tried to reach
      # 127.0.0.1:8000 and died with `httpx.ConnectError: All connection
      # attempts failed`. It is a real HTTP client by design -- it imports none
      # of Mind Palace -- so there is nothing for it to fall back to.
      #
      # This never showed up before because every earlier step in the job failed
      # first and this one was skipped. A skipped step is not a passing step.
      - name: The marketing reference integration runs standalone
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          MIND_PALACE_AUTH_MODE: required
          MIND_PALACE_RUNTIME: "0"
          MIND_PALACE_URL: http://127.0.0.1:8000
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          # The service, in this shell rather than another: a CI step has one.
          # `python -m uvicorn` rather than the console script, so it cannot pick up a
          # different interpreter from PATH.
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$MIND_PALACE_URL/openapi.json"; then ready=1; break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "::error::the server exited before becoming ready"
              cat /tmp/server.log
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::the server never became ready at $MIND_PALACE_URL"
            cat /tmp/server.log
            exit 1
          fi
          python examples/marketing-campaign-memory/demo.py

  five-minute-path:
    name: The five-minute path, from a clean checkout
    runs-on: ubuntu-latest
    needs: tests

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Apply the schema, exactly as the README says
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m alembic -c migrations/alembic.ini upgrade head

      # This job runs the documented commands as a first-time user would, and the
      # documented default is semantic. Without the weights, every read here would
      # silently degrade to lexical and still pass — the job would stop testing what
      # the README tells people to do.
      #
      # Same script and same pins as the `tests` job, deliberately: a second copy of
      # this provisioning logic is how the two jobs drift apart and only one of them
      # keeps working. Job-level HF_HUB_OFFLINE stays set, so the download happens
      # here and the documented commands themselves still run offline.
      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-1110a243fdf4706b3f48f1d95db1a4f5529b4d41-233902d25c440f23af6f7d6e94d2946bac0bee0a

      - name: Provision the pinned model weights
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python scripts/ci/provision_models.py

      - name: Verify the pinned models load offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python scripts/ci/provision_models.py --verify

      # The whole point of this milestone: the documented command sequence, run as
      # written, in a fresh environment, produces a useful memory result. It fails
      # if a first memory needs a model download, needs a corpus flag, or needs a
      # server that nobody started. The console script is used, not
      # `python -m`, so this is the command the README actually tells people to run.
      #
      # `MIND_PALACE_RUNTIME=0` here on purpose: the journey must work with no
      # background process at all. The runtime is an optimisation, and this is the
      # test that says so.
      - name: Run the documented command sequence
        env:
          MIND_PALACE_RUNTIME: "0"
        run: |
          mindpalace init
          mindpalace remember "The production datastore changed from SQLite to PostgreSQL." --key datastore
          # Assert the default read really ran semantically. A missing model makes
          # this command degrade to lexical and still print a correct answer, so
          # checking only stdout cannot tell the two apart -- and a job that silently
          # stops testing the documented default is how this gap survived.
          #
          # Matches the degradation marker rather than asserting stderr is empty:
          # `sentence-transformers` writes a weight-loading progress bar to stderr,
          # so an emptiness check fails on a perfectly healthy run.
          if mindpalace recall 'What datastore does production use?' 2>&1 1>/dev/null \
             | grep -q 'could not be loaded'; then
            echo "::error::the default read degraded to lexical; it should have used the embedding model"
            exit 1
          fi
          mindpalace recall "What datastore does production use?"
          mindpalace explain "What datastore does production use?"
          mindpalace remember "The production datastore is now distributed CockroachDB." --key datastore
          mindpalace history datastore
          mindpalace receipt "What datastore does production use?" -o receipt.json
          mindpalace verify receipt.json
          python examples/decision-memory/decision_memory.py
          python examples/project-log/project_log.py

      - name: Verify offline, with no database reachable
        env:
          DATABASE_URL: postgresql://nobody@127.0.0.1:1/nothing
          MIND_PALACE_RUNTIME: "0"
        run: |
          mindpalace verify receipt.json

      # `MIND_PALACE_LEXICAL=1` is a documented mode, so it gets the same treatment as
      # the default path: run from a clean checkout, on the documented corpus, and
      # check it actually avoids the model rather than taking a slower route to the
      # same place. The import assertion is the real check -- a timing difference on
      # a shared runner would be noise.
      - name: The documented model-free mode reads without the model
        env:
          MIND_PALACE_RUNTIME: "0"
          MIND_PALACE_LEXICAL: "1"
        run: |
          mindpalace recall "What datastore does production use?"
          mindpalace explain "What datastore does production use?"
          mindpalace history datastore
          # Assert it actually answers, not merely that it exits 0. A mode that
          # abstained on everything would satisfy every other line here, and that is
          # the failure mode this step exists to catch. The question names a
          # distinctive term on purpose: ranking scores the terms that discriminate
          # between candidates, so a question whose only shared term is one every
          # candidate carries is legitimately abstained on.
          mindpalace recall "When did we switch to CockroachDB?" | tee /dev/stderr | grep -q CockroachDB
          # It must announce itself, so nobody is mistaken about which mode answered.
          test "$(mindpalace recall 'When did we switch to CockroachDB?' 2>&1 1>/dev/null)" = \
            "retrieval: lexical (model-free, MIND_PALACE_LEXICAL=1)"
          mindpalace receipt "When did we switch to CockroachDB?" -o lexical-receipt.json
          python - <<'PY'
          import subprocess, sys

          program = (
              "import sys\n"
              "from typer.testing import CliRunner\n"
              "from cli.main import app\n"
              "result = CliRunner().invoke(app, ['recall', 'What datastore does "
              "production use?'])\n"
              "heavy = [m for m in ('torch', 'transformers', 'sentence_transformers') "
              "if m in sys.modules]\n"
              "sys.exit(1 if heavy else result.exit_code)\n"
          )
          done = subprocess.run([sys.executable, "-c", program], capture_output=True, text=True)
          assert done.returncode == 0, done.stdout + done.stderr
          print("lexical mode imported no part of the model stack")
          PY

      # And a receipt written by the model-free path verifies on the same terms as
      # one written by the default path.
      - name: Verify a receipt written in lexical mode
        env:
          DATABASE_URL: postgresql://nobody@127.0.0.1:1/nothing
          MIND_PALACE_RUNTIME: "0"
        run: |
          mindpalace verify lexical-receipt.json

      # The runtime is the other half of this release. It must come up, be
      # inspectable, produce the same answers as the in-process path, and stop
      # cleanly. Not timed here: a shared CI runner's numbers are not measurements.
      - name: The local runtime comes up, and the same answers come back through it
        run: |
          mindpalace runtime start --wait
          mindpalace runtime status
          mindpalace runtime status --json
          mindpalace recall "What datastore does production use?"
          mindpalace recall "What datastore does production use?" --json
          mindpalace runtime stop
          # With no runtime, the commands still work and still answer.
          mindpalace runtime status
          mindpalace recall "What datastore does production use?"

  wheel:
    name: Clean install from the built wheel
    runs-on: ubuntu-latest
    needs: tests

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls dist/*.whl

      # A fresh venv with no source tree on the path. If the wheel does not ship
      # the verifier, the runtime entry point, or the CLI, this is where it shows
      # up -- not in a developer's hands after they pip install it.
      #
      # Run from a directory that is not the repository, so a missing module cannot
      # be rescued by the source tree still being on the path.
      #
      # This job asserted `mindpalace-mcp --help` against a *bare* install, which
      # cannot work: `mcp` is a declared extra, so the import raised
      # `ModuleNotFoundError: No module named 'mcp'`, and the step's
      # `|| import mcp_server` fallback failed for exactly the same reason. MCP is
      # verified in its own step below, from an install that includes the extra.
      - name: Install the bare wheel, outside the source tree
        working-directory: /tmp
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install $GITHUB_WORKSPACE/dist/*.whl
          /tmp/wheelenv/bin/mindpalace --help > /dev/null
          /tmp/wheelenv/bin/mindpalace-proof --help > /dev/null
          # The CLI starts the runtime as `python -m mindpalace_runtime`. If that
          # module is not packaged, the runtime silently never starts and every
          # command stays 6 seconds with nothing to say why.
          /tmp/wheelenv/bin/python -c "
          import mindpalace_runtime, api.runtime, cli.runtime, mindpalace_sdk
          import memory_pack, memory_proof, memory_proof_cli, memory_receipt
          print('bare install: CLI, verifier, SDK and the runtime entry point all ship')
          "
          # Recorded before the extra is installed below, because that is the point
          # being made: the MCP server is opt-in, so a plain install stays small.
          /tmp/wheelenv/bin/python -c "
          import importlib.util as u
          assert u.find_spec('mcp') is None, 'mcp is a declared extra; a bare install must not provide it'
          print('bare install correctly omits the [mcp] extra')
          "

      # The portability claim, tested as a claim: a bare `pip install
      # mindpalace-os`, no CLI extra, no database URL and no network, verifying a
      # receipt file. The CLI extras are optional, so this path is the only one a
      # recipient of a receipt can rely on.
      #
      # A real one-claim receipt, not an empty bundle. An empty `receipts: []` would
      # verify the digest and nothing else, so the step would pass while testing none
      # of the claim it exists to prove.
      - name: Verify a receipt offline, from a bare install
        env:
          DATABASE_URL: postgresql://nobody@127.0.0.1:1/nothing
        run: |
          /tmp/wheelenv/bin/python - <<'PY'
          import json, pathlib, subprocess, sys

          from api.models.memory import Claim, Evidence, MemoryResponse, Source, State
          from memory_receipt import receipt_for_response, verify_response_receipt

          OBSERVED = "2026-10-08T00:00:00+00:00"
          claim = Claim(
              id="c1", key="datastore", value="PostgreSQL",
              claim="The production datastore is PostgreSQL.", status="CURRENT",
              version_id="v1", path="memory/datastore-abc.md", observed_at=OBSERVED,
              evidence_ids=["e1"],
          )
          evidence = Evidence(
              id="e1", claim_id="c1", version_id="v1", document_id="d1",
              path="memory/datastore-abc.md", source_hash="h1", chunk_id="k1",
              heading=None, text="The production datastore is PostgreSQL.",
              start_offset=0, end_offset=36, observed_at=OBSERVED,
          )
          source = Source(
              document_id="d1", version_id="v1", path="memory/datastore-abc.md",
              source_hash="h1", observed_at=OBSERVED,
          )
          response = MemoryResponse(
              query="What datastore does production use?", corpus="default",
              state=State(as_of=None, valid_at=OBSERVED),
              current_memories=[claim], evidence=[evidence], sources=[source],
          )

          # A receipt bundle written by `mindpalace receipt`: the response it
          # describes travels with it, so verification needs nothing else.
          bundle = receipt_for_response(response)
          assert bundle["receipt_count"] == 1, bundle["receipt_count"]

          document = json.loads(response.model_dump_json())
          checked = verify_response_receipt(bundle, document)
          assert checked["verified"] is True, checked
          assert checked["receipts_checked"] >= 1, checked

          path = pathlib.Path("bundle.json")

          def verify(payload):
              path.write_text(json.dumps(payload))
              return subprocess.run(
                  [sys.executable, "-m", "memory_proof_cli", "verify", str(path)],
                  capture_output=True, text=True,
              )

          done = verify({"response": document, "receipt": bundle})
          assert done.returncode == 0, done.stdout + done.stderr
          assert "VERIFIED" in done.stdout, done.stdout
          print("a bare install verifies a receipt with no database and no network")

          # And tampering is caught by the same dependency-free path -- both a
          # rewritten claim and a rewritten digest.
          forged = dict(document)
          forged["current_memories"] = [
              dict(document["current_memories"][0], claim="The datastore is SQLite.")
          ]
          done = verify({"response": forged, "receipt": bundle})
          assert done.returncode == 1, done.stdout
          assert "REJECTED" in done.stdout, done.stdout

          bundle["memory_pack_digest"] = "0" * 64
          done = verify({"response": document, "receipt": bundle})
          assert done.returncode == 1, done.stdout
          assert "REJECTED" in done.stdout, done.stdout
          print("and rejects a tampered claim and a tampered digest")
          PY

      - name: Confirm the wheel ships the verifier
        run: |
          /tmp/wheelenv/bin/python -c "
          import memory_pack, memory_proof, memory_proof_cli, memory_receipt
          print('dependency-free verifier ships in the wheel')
          "

      # LAST STEP ON PURPOSE. The two steps above depend on this environment being a
      # genuinely bare install -- the receipt step asserts that the CLI extras are
      # optional and that a recipient can verify with nothing else present. Adding
      # `mcp` before it would not break anything, but it would make their claim
      # untrue, and a test that quietly stops testing what it says is worse than no
      # test. So the extra goes in last, into the same environment: a second venv
      # would download the whole multi-gigabyte stack again for one small
      # pure-Python package.
      #
      # The wheel path goes through a variable before `[mcp]` is appended. Globbing
      # it inline works in bash but zsh reads the unquoted `[mcp]` as a character
      # class and fails the whole word, so a literal suffix cannot be trusted to a
      # single shell.
      #
      # The check is a real MCP session, not an import. `mindpalace-mcp --help` is
      # useless here: `main()` takes no arguments and goes straight to
      # `mcp.run_stdio_async()`, so it would block on stdin until the job timed out.
      # "It imported" and "it serves" are different claims, and only the second is what
      # a client depends on.
      - name: The MCP extra provides the MCP server
        working-directory: /tmp
        run: |
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          /tmp/wheelenv/bin/pip install "${wheel}[mcp]"
          test -x /tmp/wheelenv/bin/mindpalace-mcp
          /tmp/wheelenv/bin/python - <<'PY'
          import json, subprocess, sys

          REQUESTS = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize",
               "params": {"protocolVersion": "2024-11-05", "capabilities": {},
                          "clientInfo": {"name": "wheel-job", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}},
          ]

          server = subprocess.Popen(
              ["/tmp/wheelenv/bin/mindpalace-mcp"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, text=True, bufsize=1,
          )
          replies = {}
          try:
              for request in REQUESTS:
                  server.stdin.write(json.dumps(request) + "\n")
                  server.stdin.flush()
                  if "id" not in request:
                      continue  # a notification draws no reply
                  line = server.stdout.readline()
                  assert line, "the MCP server closed stdout without answering"
                  replies[json.loads(line)["id"]] = json.loads(line)
          finally:
              server.kill()
              server.wait(timeout=30)

          init = replies[1]["result"]
          assert init["serverInfo"]["name"] == "mind-palace", init
          tools = replies[2]["result"]["tools"]
          names = sorted(tool["name"] for tool in tools)
          assert len(tools) == 15, names
          for required in ("memory_recall", "memory_explain", "memory_evidence",
                           "memory_replay", "memory_pack"):
              assert required in names, f"{required} missing from tools/list"
          undocumented = [t["name"] for t in tools if not t.get("description")]
          assert not undocumented, f"tools a client cannot call: {undocumented}"
          print(f"the [mcp] extra serves a real MCP session: protocol "
                f"{init['protocolVersion']}, {len(names)} tools, all documented")
          PY

  # Upgrade safety. Every other job measures the code as it is now; this one
  # measures code that no longer exists meeting code that does.
  #
  # It builds a database with v0.9.0 -- from the TAG, not a branch -- populates it
  # through v0.9.0's own `remember`, exports a receipt and a Memory Pack with
  # v0.9.0, then upgrades to this branch's head and asserts that the old receipt
  # still verifies offline, that no claim identity moved, that no claim was lost,
  # and that the pack is byte-identical once the clock is pinned. Then it
  # downgrades to 007 and back up, and asserts the same things.
  #
  # The fixture is built with the OLD code on purpose. An upgrade test that builds
  # its fixture with the new code reads back its own assumptions and calls the
  # migration safe.
  upgrade-safety:
    name: Upgrade safety, from v0.9.0
    runs-on: ubuntu-latest
    needs: tests

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The v0.9.0 worktree this job checks out. `fetch-depth: 0` above is not
          # enough on its own; the tag object has to be present.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Provision the pinned model weights
        run: python scripts/ci/provision_models.py

      - name: Verify the pinned models load offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python scripts/ci/provision_models.py --verify

      - name: Build a v0.9.0 archive and upgrade it to head
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
          MIND_PALACE_CURSOR_SECRET: upgrade-safety-ci-cursor-secret-0000000000000000000000
        run: ./scripts/release/upgrade_safety.sh

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests
    # The BUILD runs on every branch. It used to be gated behind
    # `github.ref == 'refs/heads/main'`, which meant no branch could find out
    # whether its Dockerfile still worked until after it merged -- and a broken
    # Dockerfile is not something to discover at the moment of release.
    #
    # What stays main-only is PUSHING the image, and nothing here pushes: there is
    # no registry login on a feature branch, so there is no credential to leak.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t mindpalace:latest .

      # Built is not the same as working. An image that builds but cannot reach a
      # database, or that publishes a port the docs say it must not, is not done.
      - name: Start a database the image can reach
        run: |
          docker run -d --name mp-pg \
            -e POSTGRES_DB=mindpalace \
            -e POSTGRES_USER=mpadmin \
            -e POSTGRES_PASSWORD=secret \
            -p 5432:5432 pgvector/pgvector:pg15
          for _ in $(seq 1 30); do
            docker exec mp-pg pg_isready -U mpadmin >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mp-pg pg_isready -U mpadmin

      - name: The image does not publish a port unless asked
        run: |
          set -euo pipefail
          # Assert the behaviour docs/security.md claims instead of trusting the
          # prose. If the image published on 0.0.0.0 by default this fails, which
          # is the entire point of the assertion.
          docker run --rm mindpalace:latest --help >/dev/null 2>&1 || true
          docker ps -a --filter ancestor=mindpalace:latest --format '{{.Ports}}' \
            | tee /tmp/published
          if grep -qE '0\.0\.0\.0:[0-9]+' /tmp/published; then
            echo "::error::the image published a port on 0.0.0.0 without being asked to"
            exit 1
          fi
          echo "no port published by default"
