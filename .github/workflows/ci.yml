name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: ankane/pgvector
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8 black mypy
          flake8 api/ cli/ tests/ --max-line-length=100
          black --check api/ cli/ tests/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --maxfail=1

  build:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mindpalace:latest .
