name: CI

on:
  push:
    branches:
      - main
      - feat/reranker
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://mpadmin:secret@localhost:5432/mindpalace
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Verify package imports
        run: |
          python -c "import api, cli; print('imports ok')"

      - name: Run linting
        run: |
          python -m pip install flake8 black mypy
          flake8 api cli tests --max-line-length=100
          black --check api cli tests

      - name: Run tests
        run: |
          pytest -q --maxfail=1

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t mindpalace:latest .