# Temporary measurement workflow for migration 016 hoisting.
# THROWAWAY: delete after collecting measurements.
name: Measure hoisting (throwaway)

on:
  pull_request:
    branches:
      - main

jobs:
  fast-tests:
    name: Fast tests (3 files)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Apply database migrations
        run: |
          python -m pip install pgvector
          python -m alembic -c migrations/alembic.ini -x script_location=migrations upgrade head

      - name: Provision runtime role
        run: |
          psql postgresql://mpadmin:secret@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -v runtime_password=ci-runtime-role-password \
            -f scripts/db/runtime_roles.sql

      - name: Run fast tests
        run: |
          pytest -q tests/test_tenant_control_effectiveness.py tests/test_check_versioning_migration_head.py tests/test_scope_forgery.py

  measure:
    name: Measure hoisting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: mindpalace
          POSTGRES_USER: mpadmin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpadmin -d mindpalace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://mpadmin:secret@localhost:5432/mindpalace
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Apply database migrations (to 015)
        run: |
          python -m pip install pgvector
          python -m alembic -c migrations/alembic.ini -x script_location=migrations upgrade 015_rls_scope_enforcement

      - name: Provision runtime role
        run: |
          psql postgresql://mpadmin:secret@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -v runtime_password=ci-runtime-role-password \
            -f scripts/db/runtime_roles.sql

      - name: Rotate secret and enable enforcement
        run: |
          SCOPE_SECRET=$(openssl rand -hex 32)
          echo "SCOPE_SECRET=$SCOPE_SECRET" >> $GITHUB_ENV
          psql postgresql://mpadmin:secret@localhost:5432/mindpalace -v ON_ERROR_STOP=1 \
            -c "SET ROLE mindpalace_owner; INSERT INTO memory_server_secrets (name, value) VALUES ('scope_hmac_secret', '$SCOPE_SECRET') ON CONFLICT (name) DO UPDATE SET value = EXCLUDED.value; SELECT mp_set_scope_token_enforcement(true);"
          echo "MIND_PALACE_SCOPE_SECRET=$SCOPE_SECRET" >> $GITHUB_ENV

      - name: Run measurement
        env:
          MIND_PALACE_SCOPE_SECRET: ${{ env.SCOPE_SECRET }}
          MIND_PALACE_ENFORCE_SCOPE_TOKEN: "on"
        run: |
          python scripts/measure_hoisting.py
