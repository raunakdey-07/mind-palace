version: "3.8"

services:
  postgresql:
    image: ankane/pgvector
    # `log_error_verbosity = terse` is here because PostgreSQL's *own* server log
    # writes row content. At the default setting a constraint failure logs
    #
    #   ERROR:    null value in column "s" of relation "nn" violates not-null constraint
    #   DETAIL:   Failing row contains (hygiene-probe, CANARY_PRIVATE_FACT_...)
    #
    # and `tests/test_error_and_log_hygiene.py` proves that exact string reaches a
    # caller. The suite's own canary appeared 8 times in a CI PostgreSQL log at
    # `default` and 0 times at `terse`, on PG 15.4, with the same statement. The
    # application is already covered -- `api.main`'s handler strips it from the
    # response body and the app log -- but nothing in the application can redact a
    # line the server wrote before the application saw it.
    #
    # WHAT THIS DOES NOT COVER, stated plainly: `terse` suppresses DETAIL only.
    # The `STATEMENT` line is still logged at every verbosity. The application
    # parameterises (`VALUES ($1, $2, ...)`), so its statements carry no values and
    # this is safe for it -- but any SQL built by string interpolation would put
    # literal values in the server log regardless of this setting. `terse` is
    # defence for the DETAIL channel, not a guarantee about the server log.
    command: postgres -c log_error_verbosity=terse
    environment:
      POSTGRES_DB: mindpalace
      POSTGRES_USER: mpadmin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mpadmin", "-d", "mindpalace"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    # Binds every interface deliberately, and only because the environment below
    # sets `MIND_PALACE_DEPLOYMENT=server` with authentication on and the
    # least-privileged role. `server` refuses to start otherwise, so this line and
    # those settings cannot drift apart unnoticed.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./content:/app/content
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # A published port plus an unauthenticated service plus a database
      # superuser is the combination `docs/security.md` warns about, and it is
      # what this file used to ship as its default. Three settings close it:
      #
      #   DEPLOYMENT=server  the app refuses to start if authentication is off,
      #                      so the service cannot come up answering anyone.
      #   AUTH_MODE=required every request presents a credential.
      #   RUNTIME_DATABASE_URL  a role that is not a superuser, so migration
      #                      008's row-level policies are actually enforced.
      #                      `scripts/db/runtime_roles.sql` creates it; until then
      #                      /health/ready reports `rls_effective: false`.
      #
      #   INGEST_ROOTS         the directories `/api/ingest/repo` and
      #                      `/api/corpora/{name}/sync` may read. Both routes take
      #                      a path on the server's filesystem, so a shared service
      #                      has to be told which directories are fair game.
      #
      # The two secrets below have local-development defaults, because
      # `podman-compose` evaluates a required variable eagerly across every
      # service: with `:?`, the `backend` service's secret stopped the
      # `postgresql` service from starting, even though that service has no
      # secret in it. A default is not a deployment secret, so a server
      # deployment refuses to start while either one still holds its default
      # value. Set them in `.env` (see `.env.example`) to run the backend.
      DATABASE_URL: postgresql://${MIND_PALACE_RUNTIME_USER:-mindpalace_runtime}:${MIND_PALACE_RUNTIME_PASSWORD:-mindpalace-local-runtime-password}@postgresql:5432/mindpalace
      MIND_PALACE_DEPLOYMENT: server
      MIND_PALACE_AUTH_MODE: required
      MIND_PALACE_INGEST_ROOTS: ${MIND_PALACE_INGEST_ROOTS:-$PWD}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      LLM_MODEL: llama3.3:3b-instruct
      MIND_PALACE_CURSOR_SECRET: ${MIND_PALACE_CURSOR_SECRET:-mindpalace-local-dev-cursor-secret-00000000000000000000}
      MIND_PALACE_READINESS_TIMEOUT_SECONDS: "2"
      # Migrations run as the owner, not as the runtime role: they have to write
      # across every corpus, which is what the runtime role must not be able to.
      MIGRATION_DATABASE_URL: postgresql://mpadmin:secret@postgresql:5432/mindpalace
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
  ollama_data: