version: "3.8"

services:
  postgresql:
    image: ankane/pgvector
    environment:
      POSTGRES_DB: mindpalace
      POSTGRES_USER: mpadmin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mpadmin", "-d", "mindpalace"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./content:/app/content
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mpadmin:secret@postgresql:5432/mindpalace
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      LLM_MODEL: llama3.3:3b-instruct
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data: