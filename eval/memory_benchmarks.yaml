# Hand-authored Dispatch ground truth, not generated from memory API responses.
# Directories are complete copy-forward payloads. Apply delete AFTER the payload.
# F intentionally retains E's bytes on disk; its delete list defines effective absence.
# E first introduces the auth conflict; G reintroduces that same pair by restoration.
# Missing expectation keys are unscored; [] asserts an empty result.
# Changes labels describe the complete observed event sequence through the selector.
version: 1
stages:
  - id: A
    directory: ../examples/evaluation/corpus/stage-a
    delete: []
  - id: B
    directory: ../examples/evaluation/corpus/stage-b
    delete: []
  - id: C
    directory: ../examples/evaluation/corpus/stage-c
    delete: []
  - id: D
    directory: ../examples/evaluation/corpus/stage-d
    delete: []
  - id: E
    directory: ../examples/evaluation/corpus/stage-e
    delete: []
  - id: F
    directory: ../examples/evaluation/corpus/stage-f
    delete: [runbooks/auth-incident.md]
  - id: G
    directory: ../examples/evaluation/corpus/stage-g
    delete: []
