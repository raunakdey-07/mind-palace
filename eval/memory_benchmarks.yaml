    query: Dispatch event streaming
    expected_current_claims: [Dispatch uses Redis Streams for event streaming.]
    expected_historical_claims: []
    expected_sources: [architecture/streaming.md]
    expected_evidence: [Dispatch uses Redis Streams for event streaming.]
    expected_conflicts: []
    expected_state: {}

