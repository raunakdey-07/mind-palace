# Additional hand-authored questions and labels, never generated from service output.
# Stage aliases and delete-after-payload semantics come from memory_benchmarks.yaml.
# stage selects the observed workload; as_of selects an A/B/C temporal cutoff.
# Current means unopposed at the selected cutoff; historical means no longer active.
# Conflicting active assertions go only in expected_conflicts, including counterclaims
# outside a selected path. [] explicitly scores absence, not an omitted expectation.
# Paths are corpus-relative. Provenance questions label claims, not evidence quotes.
version: 1
queries:
