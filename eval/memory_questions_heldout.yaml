# M006.75 independent heldout split. Hand-authored from corpus bytes, not outputs.
# Freeze this file's SHA256 before exposing it to parameter selection or evaluation.
# Do not revise labels in response to retrieval results; version any later correction.
# Stage payloads and delete-after-payload rules come from memory_benchmarks.yaml.
# Historical/provenance include current AND archived document-version assertions.
# A prose-only document revision can put identical text in both claim lists.
# expected_topics partitions the complete answer by subject, including conflict sides.
# expected_keys names authored subjects, never guessed retrieval matches.
# Abstentions are manual whole-corpus absence judgments, not lexical thresholds.
