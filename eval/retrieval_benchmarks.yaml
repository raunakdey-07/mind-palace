# Retrieval Evaluation Dataset
#
# Each entry: query, expected document titles, category.
# Run with: mindpalace eval retrieval --strategies all
#
# Categories:
#   factual      - exact terminology lookup
#   semantic     - wording differs substantially from source
#   technical    - implementation/architecture details
#   project      - specific project/feature queries
#   multi-concept- several related concepts at once
#   ambiguous    - multiple documents plausibly match
#   false-positive - semantically similar but wrong docs must not dominate

# --- factual ---
- query: "mel spectrogram augmentation"
  expected: ["BirdCLEF 2023: Audio Classification"]
  category: factual

- query: "Altman Z score"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: factual

- query: "pgvector knowledge store"
  expected: ["Mind Palace — Project README"]
  category: factual

# --- semantic (different wording than source) ---
- query: "identifying bird species from sound recordings"
  expected: ["BirdCLEF 2023: Audio Classification"]
  category: semantic

- query: "tracking my stock portfolio performance"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: semantic

- query: "second brain for my research notes"
  expected: ["Mind Palace — Project README"]
  category: semantic

# --- technical ---
- query: "CNN transformer attention architecture"
  expected: ["BirdCLEF 2023: Audio Classification"]
  category: technical

- query: "SMA EMA RSI MACD indicators"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: technical

- query: "RAG question answering with local LLM"
  expected: ["Mind Palace — Project README"]
  category: technical

- query: "backtesting engine strategy validation"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: technical

# --- project ---
- query: "what did I learn from BirdCLEF"
  expected: ["BirdCLEF 2023: Audio Classification"]
  category: project

- query: "how does Finalysis handle market data"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: project

- query: "Mind Palace tech stack"
  expected: ["Mind Palace — Project README"]
  category: project

# --- multi-concept ---
- query: "compare Finalysis and BirdCLEF projects"
  expected:
    - "Finalysis: Financial Analysis Platform"
    - "BirdCLEF 2023: Audio Classification"
  category: multi-concept

- query: "ensemble models and class imbalance handling"
  expected:
    - "BirdCLEF 2023: Audio Classification"
  category: multi-concept

# --- ambiguous (multiple plausible matches; both should appear in top-k) ---
- query: "projects completed in 2023"
  expected:
    - "BirdCLEF 2023: Audio Classification"
    - "Finalysis: Financial Analysis Platform"
  category: ambiguous

- query: "machine learning projects I built"
  expected:
    - "BirdCLEF 2023: Audio Classification"
    - "Finalysis: Financial Analysis Platform"
  category: ambiguous

# --- false-positive traps ---
# Semantically close to finance but answer lives in BirdCLEF doc.
- query: "weighted averaging of model predictions"
  expected: ["BirdCLEF 2023: Audio Classification"]
  category: false-positive

# Semantically close to audio/birds but answer is Finalysis backtesting.
- query: "validating trading strategies against historical data"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: false-positive

# Close to "portfolio" wording in README but answer is Finalysis tracker.
- query: "Sharpe ratio and max drawdown metrics"
  expected: ["Finalysis: Financial Analysis Platform"]
  category: false-positive
