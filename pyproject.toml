[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindpalace-os"
version = "0.9.3"
description = "Mind Palace - AI-native Research Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg==0.30.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    # Declared here, not only in requirements.txt. `pip install mindpalace-os`
    # is a documented install path in the README, and the documented migrate step
    # is `python -m alembic ...`. Without this the bare wheel has no alembic and
    # that step fails with "No module named alembic" on a clean machine.
    "alembic>=1.13.0",
    # The embedding stack. ONNX Runtime runs the same published MiniLM weights
    # with no torch in the process: a cold `recall` measures 1.4 s against 7.6 s
    # for sentence-transformers, and the install is 90 MB against 5.1 GB.
    # `api/services/embedder.py` documents the equivalence measurement
    # (min cosine 0.99999833) that makes the two interchangeable, and
    # `tests/test_embedder_backend_equivalence.py` asserts it per text.
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyyaml>=6.0",
    "langchain-text-splitters>=1.0.0",
    # Typer is core because `mindpalace` is an unconditional console script in
    # [project.scripts], and a conditional entry point is not something setuptools
    # can express. Declared as an extra, a bare `pip install mindpalace-os` created
    # a `mindpalace` executable that died with ModuleNotFoundError on `import typer`
    # -- and the wheel job never caught it, because `transformers` depends on typer
    # and `transformers` used to arrive with `sentence-transformers`. Removing that
    # default dependency removed the accidental transit and exposed it.
    #
    # `rich` is not listed: typer requires it, and nothing here imports it directly.
    # A direct dependency you do not import is a version constraint you have to keep
    # true by hand.
    "typer>=0.9.0",
]

[project.optional-dependencies]
# Empty, and kept because the README, the quickstart and every operator's notes say
# `pip install -e '.[cli,mcp]'`. Removing it would break those install lines to save
# four characters. `[cli]` now means "the CLI, which you already have".
cli = []
mcp = ["mcp>=1.2.0"]
migrations = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
]
# The slow backend, for a deployment that wants it. Installing this alongside the
# default stack does not change what a cold command does: `api.services.embedder`
# prefers onnxruntime when it imports and only falls back to sentence-transformers
# when it does not. Use `MEMORY_EMBEDDER=torch` to force the fallback and compare.
torch = ["sentence-transformers>=2.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
mindpalace = "cli.main:app"
# Standalone, dependency-free proof tooling. A separate entry point, not a
# subcommand of the Typer CLI, because Typer is an optional extra: anyone who
# installs the package must be able to verify a proof without it.
mindpalace-proof = "memory_proof_cli:main"
# The MCP server, as a command an agent can actually launch. Same reason: an
# agent configuration should not have to know a module path or a virtualenv.
mindpalace-mcp = "mcp_server:main"

[tool.setuptools]
# Top-level single-file modules alongside the api/cli packages.
# memory_pack ships deliberately: it is the dependency-free reader a consumer
# copies or imports to understand a pack without the server.
# memory_proof and memory_proof_cli ship for the same reason: verifying a
# recorded memory must not require the server, the database or a model.
py-modules = [
    "mindpalace_errors",
    "mindpalace_sdk",
    "mcp_server",
    "memory_pack",
    "memory_proof",
    "memory_proof_cli",
    "memory_receipt",
    # The local runtime's entry point. The CLI starts it as
    # `sys.executable -m mindpalace_runtime`, which guarantees it runs the same
    # interpreter and the same installed Mind Palace as the command that started it.
    # A console script would depend on PATH, and `pip install --user` beside a
    # virtualenv is a good way to end up with a socket served by the wrong build.
    # Without this module in the wheel, the runtime silently never starts on an
    # installed package and every command is 6 seconds.
    "mindpalace_runtime",
]

[tool.setuptools.packages.find]
where = ["."]
# Only the runtime surface ships. `scripts/` is release, benchmark and
# research tooling that nothing imports at runtime -- 48 of the 54 files there
# are `scripts/benchmark/`. It stayed in the distribution because `scripts*` has
# been in this list since v0.6.0. Removing it takes the wheel from 425 KB / 129
# files to 227 KB / 74, measured, and no installed consumer loses anything:
# the console scripts, `py-modules` and every `api`/`cli` import are unaffected.
# The repository still ships them, which is where `check_versioning.py`,
# `check_evidence.py` and the benchmark harnesses run from.
include = ["api*", "cli*", "migrations*"]

[tool.setuptools.package-data]
# `migrations/` is a package (see its `__init__.py`) for exactly this reason: a
# wheel that ships no migration scripts cannot apply its own schema, and the
# documented third step of the README -- `python -m alembic -c
# migrations/alembic.ini upgrade head` -- has nothing to point at. Measured: the
# bare wheel was 13 MB with no alembic and no migrations, so `pip install
# mindpalace-os` could not reach a working first command.
migrations = ["alembic.ini", "*.mako", "versions/*.py", "versions/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repository root goes on sys.path for EVERY pytest invocation, not just
# `python -m pytest`.
#
# Three test modules import `scripts.benchmark.*` and `scripts.m009_*`, and
# `scripts/__init__.py` exists so it is an importable package. Under
# `python -m pytest` the working directory is prepended to sys.path and those
# imports resolve. Under the `pytest` console script they do not -- and CI runs
# `pytest -q`, so the first real runner to execute this branch failed collection
# with `ModuleNotFoundError: No module named 'scripts'` in three modules.
#
# The difference is not about the code under test. It is that a developer runs
# `python -m pytest` out of habit and CI runs `pytest` because that is what you
# type, so the only place the difference shows up is the machine nobody had
# looked at yet. Setting the path here makes both invocations identical, and
# makes any future invocation identical too.
pythonpath = ["."]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.ruff]
target-version = "py311"
line-length = 100