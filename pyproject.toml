[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindpalace-os"
version = "0.1.0"
description = "Mind Palace - AI-native Research Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mindpalace = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.ruff]
target-version = "py311"
line-length = 88