[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindpalace-os"
version = "0.6.0"
description = "Mind Palace - AI-native Research Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg==0.30.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    "sentence-transformers>=2.5.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyyaml>=6.0",
    "langchain-text-splitters>=1.0.0",
]

[project.optional-dependencies]
cli = ["typer>=0.9.0"]
mcp = ["mcp>=1.2.0"]
migrations = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
mindpalace = "cli.main:app"

[tool.setuptools]
# Top-level single-file modules alongside the api/cli packages.
# memory_pack ships deliberately: it is the dependency-free reader a consumer
# copies or imports to understand a pack without the server.
py-modules = ["mindpalace_sdk", "mcp_server", "memory_pack"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "cli*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.ruff]
target-version = "py311"
line-length = 100